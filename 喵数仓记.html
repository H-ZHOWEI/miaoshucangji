<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵数仓记 - 仓库库存管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #4e73df;
            --secondary: #858796;
            --success: #1cc88a;
            --warning: #f6c23e;
            --danger: #e74a3b;
            --light: #f8f9fc;
            --dark: #5a5c69;
            --shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(78, 115, 223, 0.2);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo i {
            font-size: 2.8rem;
            color: var(--primary);
        }
        
        .logo-text h1 {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 700;
        }
        
        .logo-text p {
            font-size: 1rem;
            color: var(--secondary);
        }
        
        .controls {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-success {
            background-color: var(--success);
            color: white;
        }
        
        .btn-warning {
            background-color: var(--warning);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .card-header {
            padding: 20px 25px;
            background: linear-gradient(to right, var(--primary), #6f8bf7);
            color: white;
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .search-box {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background-color: #f8f9fc;
            font-weight: 700;
            color: var(--dark);
        }
        
        tr:hover {
            background-color: #f9f9ff;
        }
        
        .low-stock {
            color: var(--danger);
            font-weight: 600;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            padding: 20px;
            background: linear-gradient(to right, var(--primary), #6f8bf7);
            color: white;
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header .close {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 20px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
        }
        
        .stat-icon.primary {
            background: linear-gradient(to right, var(--primary), #6f8bf7);
        }
        
        .stat-icon.success {
            background: linear-gradient(to right, var(--success), #3dd9a0);
        }
        
        .stat-icon.warning {
            background: linear-gradient(to right, var(--warning), #f9d371);
        }
        
        .stat-text h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .stat-text p {
            color: var(--secondary);
            font-size: 1rem;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: #eef1f9;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .record-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .record-item:last-child {
            border-bottom: none;
        }
        
        .record-field {
            min-width: 150px;
            flex: 1;
        }
        
        .record-field strong {
            display: block;
            color: var(--dark);
            font-size: 0.9rem;
        }
        
        .record-field span {
            font-size: 1.1rem;
        }
        
        .record-add {
            background-color: rgba(28, 200, 138, 0.1);
        }
        
        .record-update {
            background-color: rgba(246, 194, 62, 0.1);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--secondary);
            font-size: 0.9rem;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .controls {
                width: 100%;
                justify-content: center;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            th, td {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-warehouse"></i>
                <div class="logo-text">
                    <h1>喵数仓记</h1>
                    <p>智能仓库库存管理系统</p>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-primary" id="addBtn">
                    <i class="fas fa-plus"></i> 新增物品
                </button>
                <button class="btn btn-warning" id="updateBtn">
                    <i class="fas fa-exchange-alt"></i> 变更库存
                </button>
                <button class="btn btn-success" id="historyBtn">
                    <i class="fas fa-history"></i> 操作记录
                </button>
            </div>
        </header>
        
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon primary">
                    <i class="fas fa-boxes"></i>
                </div>
                <div class="stat-text">
                    <h3 id="totalItems">0</h3>
                    <p>库存物品总数</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success">
                    <i class="fas fa-cube"></i>
                </div>
                <div class="stat-text">
                    <h3 id="totalQuantity">0</h3>
                    <p>库存总量</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="stat-text">
                    <h3 id="lowStockItems">0</h3>
                    <p>低库存物品</p>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span>库存物品清单</span>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索物品名称...">
                    <button class="btn btn-primary">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-container">
                    <table id="inventoryTable">
                        <thead>
                            <tr>
                                <th>物品名称</th>
                                <th>当前库存</th>
                                <th>申请公司</th>
                                <th>最近操作日期</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 喵数仓记仓库管理系统 | 设计：前端工程师 | 版本 v1.0</p>
        </footer>
    </div>
    
    <!-- 新增物品模态框 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>新增物品</span>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addForm">
                    <div class="form-group">
                        <label for="itemName">物品名称 *</label>
                        <input type="text" id="itemName" required>
                    </div>
                    <div class="form-group">
                        <label for="itemQuantity">数量 *</label>
                        <input type="number" id="itemQuantity" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="itemCompany">申请公司</label>
                        <input type="text" id="itemCompany">
                    </div>
                    <div class="form-group">
                        <label for="itemDepartment">领取部门</label>
                        <input type="text" id="itemDepartment">
                    </div>
                    <div class="form-group">
                        <label for="itemRecipient">领取人</label>
                        <input type="text" id="itemRecipient">
                    </div>
                    <div class="form-group">
                        <label for="itemDate">领取日期</label>
                        <input type="date" id="itemDate" value="">
                    </div>
                    <div class="form-group">
                        <label for="itemNotes">备注</label>
                        <textarea id="itemNotes"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn" id="cancelAdd">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 变更库存模态框 -->
    <div class="modal" id="updateModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>变更库存</span>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="updateForm">
                    <div class="form-group">
                        <label for="updateItem">选择物品 *</label>
                        <select id="updateItem" required>
                            <option value="">-- 请选择物品 --</option>
                            <!-- 动态填充 -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="updateQuantity">变更数量 *</label>
                        <input type="number" id="updateQuantity" min="1" required>
                        <small style="color: var(--danger);">注意：变更操作会减少库存数量</small>
                    </div>
                    <div class="form-group">
                        <label for="updateCompany">申请公司</label>
                        <input type="text" id="updateCompany">
                    </div>
                    <div class="form-group">
                        <label for="updateDepartment">领取部门</label>
                        <input type="text" id="updateDepartment">
                    </div>
                    <div class="form-group">
                        <label for="updateRecipient">领取人</label>
                        <input type="text" id="updateRecipient">
                    </div>
                    <div class="form-group">
                        <label for="updateDate">领取日期</label>
                        <input type="date" id="updateDate" value="">
                    </div>
                    <div class="form-group">
                        <label for="updateNotes">备注</label>
                        <textarea id="updateNotes"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn" id="cancelUpdate">取消</button>
                        <button type="submit" class="btn btn-warning">确认变更</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 操作记录模态框 -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>操作记录</span>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="all">全部记录</button>
                    <button class="tab-btn" data-tab="add">新增记录</button>
                    <button class="tab-btn" data-tab="update">变更记录</button>
                </div>
                <div id="historyList">
                    <!-- 动态填充 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化数据
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        let records = JSON.parse(localStorage.getItem('records')) || [];
        
        // DOM元素
        const addModal = document.getElementById('addModal');
        const updateModal = document.getElementById('updateModal');
        const historyModal = document.getElementById('historyModal');
        const addBtn = document.getElementById('addBtn');
        const updateBtn = document.getElementById('updateBtn');
        const historyBtn = document.getElementById('historyBtn');
        const addForm = document.getElementById('addForm');
        const updateForm = document.getElementById('updateForm');
        const inventoryTable = document.querySelector('#inventoryTable tbody');
        const updateItemSelect = document.getElementById('updateItem');
        const historyList = document.getElementById('historyList');
        const searchInput = document.getElementById('searchInput');
        
        // 统计元素
        const totalItemsEl = document.getElementById('totalItems');
        const totalQuantityEl = document.getElementById('totalQuantity');
        const lowStockItemsEl = document.getElementById('lowStockItems');
        
        // 设置默认日期为今天
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('itemDate').value = today;
        document.getElementById('updateDate').value = today;
        
        // 初始化页面
        function initPage() {
            renderInventoryTable();
            updateStats();
            populateUpdateItems();
        }
        
        // 渲染库存表格
        function renderInventoryTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredInventory = inventory.filter(item => 
                item.name.toLowerCase().includes(searchTerm)
            );
            
            inventoryTable.innerHTML = '';
            
            if (filteredInventory.length === 0) {
                inventoryTable.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px;">
                            <i class="fas fa-box-open" style="font-size: 3rem; color: #ddd; margin-bottom: 15px;"></i>
                            <p>没有找到库存物品</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            filteredInventory.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.quantity} <span class="low-stock">${item.quantity < 10 ? '(低库存)' : ''}</span></td>
                    <td>${item.company || '-'}</td>
                    <td>${item.lastUpdated || '-'}</td>
                    <td>${item.quantity < 10 ? '<span class="low-stock">需补货</span>' : '库存充足'}</td>
                `;
                inventoryTable.appendChild(tr);
            });
        }
        
        // 更新统计信息
        function updateStats() {
            totalItemsEl.textContent = inventory.length;
            
            const totalQuantity = inventory.reduce((sum, item) => sum + item.quantity, 0);
            totalQuantityEl.textContent = totalQuantity;
            
            const lowStockItems = inventory.filter(item => item.quantity < 10).length;
            lowStockItemsEl.textContent = lowStockItems;
        }
        
        // 填充变更物品下拉菜单
        function populateUpdateItems() {
            updateItemSelect.innerHTML = '<option value="">-- 请选择物品 --</option>';
            
            inventory.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = `${item.name} (当前库存: ${item.quantity})`;
                updateItemSelect.appendChild(option);
            });
        }
        
        // 保存数据到localStorage
        function saveData() {
            localStorage.setItem('inventory', JSON.stringify(inventory));
            localStorage.setItem('records', JSON.stringify(records));
        }
        
        // 打开模态框
        function openModal(modal) {
            modal.style.display = 'flex';
        }
        
        // 关闭模态框
        function closeModal(modal) {
            modal.style.display = 'none';
        }
        
        // 添加新物品
        function addItem(e) {
            e.preventDefault();
            
            const name = document.getElementById('itemName').value;
            const quantity = parseInt(document.getElementById('itemQuantity').value);
            const company = document.getElementById('itemCompany').value;
            const department = document.getElementById('itemDepartment').value;
            const recipient = document.getElementById('itemRecipient').value;
            const date = document.getElementById('itemDate').value;
            const notes = document.getElementById('itemNotes').value;
            
            // 检查物品是否已存在
            const existingItem = inventory.find(item => item.name.toLowerCase() === name.toLowerCase());
            
            if (existingItem) {
                // 更新现有物品数量
                existingItem.quantity += quantity;
                existingItem.lastUpdated = date;
                
                // 记录操作
                records.push({
                    id: Date.now(),
                    type: 'add',
                    itemId: existingItem.id,
                    name: existingItem.name,
                    quantity: quantity,
                    company: company,
                    department: department,
                    recipient: recipient,
                    date: date,
                    notes: notes,
                    timestamp: new Date().toISOString()
                });
            } else {
                // 创建新物品
                const newItem = {
                    id: Date.now(),
                    name: name,
                    quantity: quantity,
                    company: company,
                    lastUpdated: date
                };
                
                inventory.push(newItem);
                
                // 记录操作
                records.push({
                    id: Date.now(),
                    type: 'add',
                    itemId: newItem.id,
                    name: name,
                    quantity: quantity,
                    company: company,
                    department: department,
                    recipient: recipient,
                    date: date,
                    notes: notes,
                    timestamp: new Date().toISOString()
                });
            }
            
            saveData();
            renderInventoryTable();
            updateStats();
            populateUpdateItems();
            closeModal(addModal);
            addForm.reset();
            document.getElementById('itemDate').value = today;
            
            alert('物品添加成功！');
        }
        
        // 变更库存
        function updateItem(e) {
            e.preventDefault();
            
            const itemId = parseInt(updateItemSelect.value);
            const quantity = parseInt(document.getElementById('updateQuantity').value);
            const company = document.getElementById('updateCompany').value;
            const department = document.getElementById('updateDepartment').value;
            const recipient = document.getElementById('updateRecipient').value;
            const date = document.getElementById('updateDate').value;
            const notes = document.getElementById('updateNotes').value;
            
            const item = inventory.find(i => i.id === itemId);
            
            if (!item) {
                alert('未找到所选物品！');
                return;
            }
            
            if (item.quantity < quantity) {
                alert(`库存不足！当前库存：${item.quantity}`);
                return;
            }
            
            // 更新库存
            item.quantity -= quantity;
            item.lastUpdated = date;
            
            // 记录操作
            records.push({
                id: Date.now(),
                type: 'update',
                itemId: item.id,
                name: item.name,
                quantity: quantity,
                company: company,
                department: department,
                recipient: recipient,
                date: date,
                notes: notes,
                timestamp: new Date().toISOString()
            });
            
            saveData();
            renderInventoryTable();
            updateStats();
            populateUpdateItems();
            closeModal(updateModal);
            updateForm.reset();
            document.getElementById('updateDate').value = today;
            
            alert('库存变更成功！');
        }
        
        // 渲染操作记录
        function renderRecords(type = 'all') {
            historyList.innerHTML = '';
            
            let filteredRecords = records;
            
            if (type === 'add') {
                filteredRecords = records.filter(record => record.type === 'add');
            } else if (type === 'update') {
                filteredRecords = records.filter(record => record.type === 'update');
            }
            
            if (filteredRecords.length === 0) {
                historyList.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--secondary);">
                        <i class="fas fa-file-alt" style="font-size: 3rem; margin-bottom: 15px;"></i>
                        <p>没有找到操作记录</p>
                    </div>
                `;
                return;
            }
            
            filteredRecords.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            filteredRecords.forEach(record => {
                const recordEl = document.createElement('div');
                recordEl.className = `record-item ${record.type === 'add' ? 'record-add' : 'record-update'}`;
                
                recordEl.innerHTML = `
                    <div class="record-field">
                        <strong>操作类型</strong>
                        <span>${record.type === 'add' ? '新增物品' : '库存变更'}</span>
                    </div>
                    <div class="record-field">
                        <strong>物品名称</strong>
                        <span>${record.name}</span>
                    </div>
                    <div class="record-field">
                        <strong>数量</strong>
                        <span>${record.quantity} ${record.type === 'add' ? '<i class="fas fa-plus" style="color: var(--success);"></i>' : '<i class="fas fa-minus" style="color: var(--danger);"></i>'}</span>
                    </div>
                    <div class="record-field">
                        <strong>操作日期</strong>
                        <span>${record.date}</span>
                    </div>
                    <div class="record-field">
                        <strong>领取人</strong>
                        <span>${record.recipient || '-'}</span>
                    </div>
                    <div class="record-field">
                        <strong>申请公司</strong>
                        <span>${record.company || '-'}</span>
                    </div>
                    <div class="record-field">
                        <strong>领取部门</strong>
                        <span>${record.department || '-'}</span>
                    </div>
                    <div class="record-field" style="min-width: 100%;">
                        <strong>备注</strong>
                        <span>${record.notes || '-'}</span>
                    </div>
                `;
                
                historyList.appendChild(recordEl);
            });
        }
        
        // 事件监听器
        addBtn.addEventListener('click', () => openModal(addModal));
        updateBtn.addEventListener('click', () => openModal(updateModal));
        historyBtn.addEventListener('click', () => {
            openModal(historyModal);
            renderRecords();
        });
        
        document.querySelectorAll('.close').forEach(btn => {
            btn.addEventListener('click', function() {
                closeModal(this.closest('.modal'));
            });
        });
        
        document.getElementById('cancelAdd').addEventListener('click', () => {
            closeModal(addModal);
            addForm.reset();
        });
        
        document.getElementById('cancelUpdate').addEventListener('click', () => {
            closeModal(updateModal);
            updateForm.reset();
        });
        
        addForm.addEventListener('submit', addItem);
        updateForm.addEventListener('submit', updateItem);
        
        searchInput.addEventListener('input', renderInventoryTable);
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderRecords(this.dataset.tab);
            });
        });
        
        // 点击模态框外部关闭模态框
        window.addEventListener('click', function(e) {
            if (e.target === addModal) closeModal(addModal);
            if (e.target === updateModal) closeModal(updateModal);
            if (e.target === historyModal) closeModal(historyModal);
        });
        
        // 初始化页面
        initPage();
